<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Georgia, serif">
  <rect width="900" height="620" fill="#f4f1ea"/>
  <text x="20" y="32" font-size="20" fill="#2b2b2b">The Garden — proposed plan (P6)</text>
  <text x="20" y="52" font-size="12" fill="#666">North up. Island about 400 m a side; terraces 120 m at the foot, 40 m at the top.</text>
  <!-- marsh + water -->
  <rect x="30" y="75" width="520" height="520" fill="#c9d6c2"/>
  <text x="40" y="92" font-size="11" fill="#556">reed marsh, palms</text>
  <rect x="70" y="115" width="440" height="440" fill="#9fc3d6"/>
  <!-- causeway east -->
  <rect x="440" y="323" width="110" height="24" fill="#bdb6a8" stroke="#7d776c"/>
  <!-- island -->
  <rect x="100" y="145" width="380" height="380" rx="14" fill="#a9b98f" stroke="#7d776c" stroke-width="2"/>
  <!-- quarters labels -->
  <text x="140" y="200" font-size="12" fill="#2f3f25">orchard</text>
  <text x="370" y="200" font-size="12" fill="#2f3f25">tall trees</text>
  <text x="130" y="490" font-size="12" fill="#2f3f25">flowers, open ground</text>
  <text x="380" y="490" font-size="12" fill="#2f3f25">wild, dense</text>
  <!-- channels -->
  <g stroke="#5f9fc0" stroke-width="8">
    <line x1="290" y1="145" x2="290" y2="270"/><line x1="290" y1="400" x2="290" y2="525"/>
    <line x1="100" y1="335" x2="225" y2="335"/><line x1="355" y1="335" x2="480" y2="335"/>
  </g>
  <!-- terraces -->
  <g fill="none" stroke="#6e6a62" stroke-width="2">
    <rect x="225" y="270" width="130" height="130" fill="#b9b4aa"/>
    <rect x="236" y="281" width="108" height="108" fill="#c3beb4"/>
    <rect x="247" y="292" width="86" height="86" fill="#cdc8be"/>
    <rect x="258" y="303" width="64" height="64" fill="#d7d2c8"/>
    <rect x="268" y="313" width="44" height="44" fill="#e6e1d6"/>
  </g>
  <circle cx="290" cy="335" r="5" fill="#3d86b0"/>
  <circle cx="278" cy="323" r="7" fill="#3f6b2e"/><circle cx="302" cy="347" r="7" fill="#5a4a2a"/>
  <!-- labels -->
  <text x="445" y="317" font-size="12" fill="#2b2b2b">causeway east</text>
  <text x="445" y="362" font-size="11" fill="#8a3b1f">cherubim, the fire (3:24)</text>
  <text x="75" y="575" font-size="11" fill="#2b4f66">fresh water, 30–60 m (Ezek 31:4)</text>
  <!-- legend -->
  <g font-size="12" fill="#2b2b2b">
    <circle cx="585" cy="110" r="5" fill="#3d86b0"/><text x="598" y="114">spring on the top (2:10)</text>
    <line x1="578" y1="135" x2="594" y2="135" stroke="#5f9fc0" stroke-width="6"/><text x="598" y="139">four channels, four quarters</text>
    <circle cx="585" cy="160" r="6" fill="#3f6b2e"/><text x="598" y="164">tree of life</text>
    <circle cx="585" cy="184" r="6" fill="#5a4a2a"/><text x="598" y="188">tree of knowledge</text>
    <rect x="579" y="200" width="12" height="12" fill="#c3beb4" stroke="#6e6a62"/><text x="598" y="211">five stone terraces</text>
  </g>
  <!-- section -->
  <text x="580" y="270" font-size="14" fill="#2b2b2b">Section, west–east</text>
  <rect x="575" y="420" width="300" height="20" fill="#9fc3d6"/>
  <polygon points="590,420 860,420 860,412 590,412" fill="#a9b98f"/>
  <g fill="#c3beb4" stroke="#6e6a62">
    <rect x="680" y="400" width="90" height="12"/><rect x="688" y="388" width="74" height="12"/>
    <rect x="696" y="376" width="58" height="12"/><rect x="704" y="364" width="42" height="12"/>
    <rect x="712" y="352" width="26" height="12"/>
  </g>
  <line x1="718" y1="352" x2="718" y2="322" stroke="#3f6b2e" stroke-width="3"/><circle cx="718" cy="316" r="10" fill="#3f6b2e"/>
  <line x1="732" y1="352" x2="732" y2="325" stroke="#5a4a2a" stroke-width="3"/><circle cx="732" cy="319" r="10" fill="#5a4a2a"/>
  <rect x="860" y="414" width="20" height="5" fill="#bdb6a8"/>
  <text x="580" y="462" font-size="11" fill="#555">about 12 m high; the way out is down, then east across the water</text>
  <text x="580" y="300" font-size="11" fill="#555">morning: mist off the water, blue shade,</text>
  <text x="580" y="314" font-size="11" fill="#555">warm sun breaking through</text>
</svg>
