<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Georgia, serif">
  <rect width="900" height="620" fill="#f4f1ea"/>
  <text x="20" y="32" font-size="20" fill="#2b2b2b">The Garden — the ring (decided 2026-10-10 and 2026-10-13)</text>
  <text x="20" y="52" font-size="12" fill="#666">North up. Round island about 450 m across in a ring of fresh water; terraces round at the foot, squared toward the top by Adam.</text>
  <rect x="30" y="75" width="560" height="520" fill="#c9d6c2"/>
  <text x="40" y="92" font-size="11" fill="#556">reed marsh, palms</text>
  <!-- natural rivers beyond the ring -->
  <g fill="none" stroke="#7fb3cf" stroke-width="7" stroke-linecap="round">
    <path d="M290,90 C300,80 270,70 285,60"/><path d="M290,580 C275,592 305,600 290,612"/>
    <path d="M45,335 C38,320 30,350 22,338"/><path d="M535,335 C548,333 556,339 568,337 S583,331 590,333"/>
  </g>
  <circle cx="290" cy="335" r="245" fill="#9fc3d6"/>
  <circle cx="290" cy="335" r="245" fill="none" stroke="#bdb6a8" stroke-width="4"/>
  <!-- current seams -->
  <g stroke="#c4e0ee" stroke-width="4" stroke-dasharray="6 5">
    <line x1="290" y1="90" x2="290" y2="135"/><line x1="290" y1="535" x2="290" y2="580"/>
    <line x1="45" y1="335" x2="90" y2="335"/><line x1="490" y1="335" x2="535" y2="335"/>
  </g>
  <rect x="488" y="339" width="49" height="11" fill="#bdb6a8" stroke="#7d776c"/>
  <path d="M536,344.5 C548,342.5 556,348.5 568,346.5 S583,340.5 590,342.5" fill="none" stroke="#bdb6a8" stroke-width="9" stroke-linecap="butt"/>
  <circle cx="290" cy="335" r="200" fill="#a9b98f" stroke="#7d776c" stroke-width="2"/>
  <g fill="#cfcac0">
    <rect x="279" y="135" width="22" height="135"/><rect x="279" y="400" width="22" height="135"/>
    <rect x="90" y="324" width="135" height="22"/><rect x="355" y="324" width="135" height="22"/>
  </g>
  <g fill="none" stroke="#d9c9a3" stroke-width="3" stroke-linecap="round">
    <path d="M279,190 C230,200 200,240 160,230 S130,280 150,305 M255,300 C220,280 190,300 175,260"/>
    <path d="M301,195 C340,225 390,195 420,230 S440,290 405,305 M301,250 C340,240 360,280 330,312"/>
    <path d="M279,440 C240,420 200,465 165,440 S135,385 155,362 M250,395 C210,400 190,372 140,388"/>
    <path d="M301,470 C350,495 395,445 425,465 S445,385 410,362 M335,355 C360,400 330,430 301,420"/>
  </g>
  <g stroke="#5f9fc0" stroke-width="8">
    <line x1="290" y1="135" x2="290" y2="275"/><line x1="290" y1="395" x2="290" y2="535"/>
    <line x1="90" y1="335" x2="230" y2="335"/><line x1="350" y1="335" x2="490" y2="335"/>
  </g>
  <g stroke="#6e6a62" stroke-width="2">
    <circle cx="290" cy="335" r="66" fill="#b9b4aa"/>
    <circle cx="290" cy="335" r="54" fill="#c3beb4"/>
    <rect x="248" y="293" width="84" height="84" rx="16" fill="#cdc8be"/>
    <rect x="258" y="303" width="64" height="64" rx="6" fill="#d7d2c8"/>
    <rect x="268" y="313" width="44" height="44" fill="#e6e1d6"/>
  </g>
  <circle cx="290" cy="335" r="5" fill="#3d86b0"/>
  <circle cx="290" cy="320" r="7" fill="#3f6b2e"/><circle cx="290" cy="350" r="7" fill="#5a4a2a"/>
  <line x1="340" y1="335" x2="312" y2="335" stroke="#8a3b1f" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polyline points="488,343 356,343 340,335" fill="none" stroke="#8a3b1f" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="491" cy="344" r="4" fill="#8a3b1f"/>
  <text x="440" y="316" font-size="11" fill="#8a3b1f">Adam, 2:8</text>
  <text x="470" y="372" font-size="12" fill="#2b2b2b">causeway, beside the river</text>
  <text x="470" y="387" font-size="11" fill="#8a3b1f">cherubim (3:24)</text>
  <text x="60" y="590" font-size="11" fill="#2b4f66">ring of fresh water, held by a rim of spring stone</text>
  <g font-size="12" fill="#2b2b2b">
    <circle cx="620" cy="100" r="5" fill="#3d86b0"/><text x="633" y="104">spring between the trees (2:10)</text>
    <line x1="613" y1="122" x2="629" y2="122" stroke="#5f9fc0" stroke-width="6"/><text x="633" y="126">headwaters, straight to the ring</text>
    <line x1="613" y1="143" x2="629" y2="143" stroke="#c4e0ee" stroke-width="4" stroke-dasharray="6 5"/><text x="633" y="147">current seams across the ring</text>
    <line x1="613" y1="164" x2="629" y2="164" stroke="#7fb3cf" stroke-width="6"/><text x="633" y="168">natural rivers beyond the rim</text>
    <circle cx="620" cy="186" r="6" fill="#3f6b2e"/><text x="633" y="190">tree of life, north</text>
    <circle cx="620" cy="208" r="6" fill="#5a4a2a"/><text x="633" y="212">tree of knowledge, south</text>
    <circle cx="620" cy="230" r="6" fill="#c3beb4" stroke="#6e6a62"/><text x="633" y="234">terraces: round (the spring's)...</text>
    <rect x="614" y="246" width="12" height="12" fill="#e6e1d6" stroke="#6e6a62"/><text x="633" y="257">...squared at the top (Adam's)</text>
    <rect x="614" y="268" width="12" height="12" fill="#cfcac0"/><text x="633" y="279">grey limestone paths, headwaters</text>
    <line x1="613" y1="296" x2="629" y2="296" stroke="#d9c9a3" stroke-width="3"/><text x="633" y="300">winding paths, quarters</text>
    <line x1="613" y1="318" x2="629" y2="318" stroke="#8a3b1f" stroke-width="1.5" stroke-dasharray="3 3"/><text x="633" y="322">Adam's walk in from the east (2:8)</text>
  </g>
  <text x="615" y="367" font-size="13" fill="#2b2b2b">Decided 2026-10-13 (LAYOUT §10.4, §10.7):</text>
  <text x="615" y="387" font-size="11" fill="#555">Eridu's dune to the east, the Garden's gate:</text>
  <text x="615" y="403" font-size="11" fill="#555">its first shrine where the cherubim stood,</text>
  <text x="615" y="419" font-size="11" fill="#555">and Babel's tower raised there later,</text>
  <text x="615" y="435" font-size="11" fill="#555">looking over the drowned Garden.</text>
  <text x="615" y="451" font-size="11" fill="#8a3b1f">(the Garden ~5500 BC; Eridu after, ~5400 BC)</text>
  <text x="615" y="475" font-size="11" fill="#555">Coming in from the east, the way runs</text>
  <text x="615" y="491" font-size="11" fill="#555">straight up between the two trees.</text>
</svg>
